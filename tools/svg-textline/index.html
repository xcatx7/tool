<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>筆畫動態產生器 — textline 群組</title>
<style>
  :root{
    --paper: #f2ece0;
    --paper-deep: #e7ddc9;
    --ink: #24211b;
    --ink-soft: #5b5344;
    --line: #cfc3a8;
    --wax: #a53f2f;
    --wax-dim: #c98d80;
    --teal: #3c6e6a;
    --mono: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    --serif: Georgia, "Iowan Old Style", "Noto Serif TC", serif;
    --sans: -apple-system, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  header{
    padding: 28px clamp(20px,4vw,48px) 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(22px, 3vw, 30px);
    margin: 0 0 6px;
    letter-spacing: .2px;
  }
  header p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.6;
    max-width: 640px;
  }
  header code{
    background: var(--paper-deep);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
  }
  main{
    display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr;
    gap: 0;
    min-height: calc(100vh - 110px);
  }
  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
  }
  .panel{
    padding: 24px clamp(16px,3vw,32px);
  }
  .panel-left{
    border-right: 1px solid var(--line);
    background: var(--paper);
  }
  .panel-right{
    background: var(--paper-deep);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  textarea, input[type="text"]{
    width: 100%;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    padding: 10px 12px;
    resize: vertical;
  }
  textarea:focus, input:focus{
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }
  #svgInput{ height: 260px; }
  .field{ margin-bottom: 18px; }
  .row{
    display:flex;
    gap: 12px;
    align-items: flex-end;
  }
  .row .field{ flex:1; margin-bottom:0; }
  button{
    font-family: var(--sans);
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-weight: 600;
  }
  .btn-primary{
    background: var(--wax);
    color: #fdf5ef;
    width: 100%;
    margin-top: 4px;
  }
  .btn-primary:hover{ background: #8f3527; }
  .btn-primary:disabled{ background: var(--wax-dim); cursor: not-allowed; }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 7px 14px;
    font-size: 13px;
  }
  .btn-ghost:hover{ background: var(--ink); color: var(--paper); }
  .error{
    margin-top: 12px;
    font-size: 13px;
    color: var(--wax);
    display:none;
  }
  .meta{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 10px;
    line-height: 1.6;
  }
  .preview-box{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    flex: 1;
    min-height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    overflow: auto;
  }
  .preview-box svg{ max-width: 100%; height: auto; display:block; }
  .preview-empty{
    color: var(--ink-soft);
    font-size: 13px;
    text-align:center;
    max-width: 260px;
    line-height: 1.6;
  }
  .duration-block{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
  }
  .duration-head{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .duration-head span:first-child{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .duration-head strong{
    font-family: var(--mono);
    font-size: 15px;
  }
  input[type="range"]{
    width: 100%;
    accent-color: var(--wax);
  }
  .output-head{
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  .output-head span{ font-size: 13px; color: var(--ink-soft); }
  .btn-group{ display:flex; gap: 8px; }
  #outputCode{
    width:100%;
    height: 220px;
    font-size: 11.5px;
  }
</style>
</head>
<body>

<header>
  <h1>筆畫動態產生器</h1>
  <p>貼上完整 SVG，工具會找到 <code>id="textline"</code> 群組內的每條 <code>&lt;path&gt;</code>，量出實際筆畫長度，依序產生 <code>stroke-dashoffset</code> 動畫（前一筆畫結束才接下一筆），並可用下方滑桿調整整體秒數。</p>
</header>

<main>
  <section class="panel panel-left">
    <div class="field">
      <label for="svgInput">貼上 SVG 原始碼</label>
      <textarea id="svgInput" placeholder="&lt;svg ...&gt;
  &lt;g id=&quot;textline&quot;&gt;
    &lt;path d=&quot;...&quot; .../&gt;
    ...
  &lt;/g&gt;
&lt;/svg&gt;"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="groupId">目標群組 id</label>
        <input type="text" id="groupId" value="textline">
      </div>
    </div>
    <button class="btn-primary" id="generateBtn">產生筆畫動態</button>
    <div class="error" id="errorBox"></div>
    <div class="meta" id="metaBox"></div>
  </section>

  <section class="panel panel-right">
    <div class="preview-box" id="previewBox">
      <div class="preview-empty">尚未產生動態。左側貼上 SVG 後按「產生筆畫動態」，預覽會顯示在這裡。</div>
    </div>

    <div class="duration-block">
      <div class="duration-head">
        <span>整體秒數</span>
        <strong id="durationValue">3.0s</strong>
      </div>
      <input type="range" id="durationRange" min="0.5" max="15" step="0.1" value="3" disabled>
    </div>

    <div>
      <div class="output-head">
        <span>輸出 SVG</span>
        <div class="btn-group">
          <button class="btn-ghost" id="replayBtn" disabled>重播</button>
          <button class="btn-ghost" id="copyBtn" disabled>複製</button>
          <button class="btn-ghost" id="downloadBtn" disabled>下載 .svg</button>
        </div>
      </div>
      <textarea id="outputCode" readonly placeholder="產生後這裡會顯示完整的 SVG 原始碼"></textarea>
    </div>
  </section>
</main>

<svg id="measureSvg" style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;" aria-hidden="true">
  <path id="measurePath" d=""></path>
</svg>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";

const svgInput = document.getElementById('svgInput');
const groupIdInput = document.getElementById('groupId');
const generateBtn = document.getElementById('generateBtn');
const errorBox = document.getElementById('errorBox');
const metaBox = document.getElementById('metaBox');
const previewBox = document.getElementById('previewBox');
const durationRange = document.getElementById('durationRange');
const durationValue = document.getElementById('durationValue');
const outputCode = document.getElementById('outputCode');
const replayBtn = document.getElementById('replayBtn');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const measurePath = document.getElementById('measurePath');

let state = null; // { doc, svgEl, pathEntries: [{node, length}] }

function showError(msg){
  errorBox.textContent = msg;
  errorBox.style.display = msg ? 'block' : 'none';
}

function measureLength(d){
  measurePath.setAttribute('d', d || '');
  try{
    return measurePath.getTotalLength();
  }catch(e){
    return 0;
  }
}

function parseAndMeasure(){
  showError('');
  metaBox.textContent = '';
  const raw = svgInput.value.trim();
  const groupId = (groupIdInput.value || '').trim() || 'textline';

  if(!raw){
    showError('請先貼上 SVG 原始碼。');
    return false;
  }

  const doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
  const parseErr = doc.querySelector('parsererror');
  if(parseErr){
    showError('SVG 解析失敗，請確認貼上的內容完整且格式正確。');
    return false;
  }

  const svgEl = doc.documentElement;
  if(!svgEl || svgEl.nodeName.toLowerCase() !== 'svg'){
    showError('找不到 <svg> 根元素。');
    return false;
  }

  const group = svgEl.querySelector('#' + CSS.escape(groupId));
  if(!group){
    showError('在 SVG 裡找不到 id="' + groupId + '" 的群組。');
    return false;
  }

  const pathNodes = Array.from(group.querySelectorAll('path'));
  if(!pathNodes.length){
    showError('該群組內沒有找到任何 <path>。');
    return false;
  }

  const pathEntries = pathNodes.map(node => ({
    node,
    length: measureLength(node.getAttribute('d'))
  }));

  state = { doc, svgEl, group, pathEntries };
  return true;
}

function applyAnimations(){
  if(!state) return;
  const totalDuration = parseFloat(durationRange.value) || 0;
  const sumLen = state.pathEntries.reduce((s, p) => s + p.length, 0);

  // Cumulative absolute start times, rather than chaining with begin="prevId.end".
  // Syncbase (id.end) references are unreliable once the SVG is injected
  // dynamically (as the preview does) — absolute times always play correctly,
  // both here and in a plain static SVG file.
  let cumulative = 0;
  state.pathEntries.forEach((entry, i) => {
    const el = entry.node;
    const len = entry.length;

    // clear any previous animate children we may have added on a prior render
    Array.from(el.querySelectorAll('animate')).forEach(a => a.remove());

    // Round up to 1 decimal place — trims file size, a sub-pixel-scale
    // difference never affects how the stroke draw looks.
    const lenStr = (Math.ceil(len * 10) / 10).toFixed(1);

    el.setAttribute('stroke-dasharray', lenStr);
    el.setAttribute('stroke-dashoffset', lenStr);

    const dur = sumLen > 0 ? Math.max(totalDuration * (len / sumLen), 0.01) : 0.01;
    const id = 'stroke-a' + (i + 1);

    const animate = state.doc.createElementNS(SVG_NS, 'animate');
    animate.setAttribute('attributeName', 'stroke-dashoffset');
    animate.setAttribute('fill', 'freeze');
    animate.setAttribute('from', lenStr);
    animate.setAttribute('to', '0');
    animate.setAttribute('dur', dur.toFixed(3) + 's');
    animate.setAttribute('id', id);
    animate.setAttribute('begin', cumulative.toFixed(3) + 's');

    el.appendChild(animate);
    cumulative += dur;
  });

  const serialized = new XMLSerializer().serializeToString(state.svgEl)
    .replace(/></g, '>\n<');

  outputCode.value = serialized;
  renderPreview(serialized);

  const totalActual = state.pathEntries.reduce((s, p, i) => {
    const dur = sumLen > 0 ? Math.max(totalDuration * (p.length / sumLen), 0.01) : 0.01;
    return s + dur;
  }, 0);

  metaBox.textContent = '找到 ' + state.pathEntries.length + ' 條筆畫，總長度約 ' +
    sumLen.toFixed(1) + ' 單位，實際動畫總時長約 ' + totalActual.toFixed(2) + ' 秒。';

  replayBtn.disabled = false;
  copyBtn.disabled = false;
  downloadBtn.disabled = false;
}

function renderPreview(svgString){
  previewBox.innerHTML = svgString;
}

durationValue.textContent = parseFloat(durationRange.value).toFixed(1) + 's';

generateBtn.addEventListener('click', () => {
  if(parseAndMeasure()){
    durationRange.disabled = false;
    applyAnimations();
  } else {
    previewBox.innerHTML = '<div class="preview-empty">尚未產生動態。左側貼上 SVG 後按「產生筆畫動態」，預覽會顯示在這裡。</div>';
    outputCode.value = '';
    durationRange.disabled = true;
    replayBtn.disabled = true;
    copyBtn.disabled = true;
    downloadBtn.disabled = true;
  }
});

durationRange.addEventListener('input', () => {
  durationValue.textContent = parseFloat(durationRange.value).toFixed(1) + 's';
  if(state) applyAnimations();
});

replayBtn.addEventListener('click', () => {
  if(outputCode.value) renderPreview(outputCode.value);
});

copyBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(outputCode.value);
    copyBtn.textContent = '已複製';
    setTimeout(() => { copyBtn.textContent = '複製'; }, 1400);
  }catch(e){
    outputCode.select();
    document.execCommand('copy');
  }
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([outputCode.value], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'textline-animated.svg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
