<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 水波濾鏡效果調整工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        /* 左側控制面板 */
        .controls {
            width: 380px;
            padding: 24px;
            background-color: #242424;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            color: #00d2ff;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            resize: vertical;
            word-break: break-all;
        }

        .btn-update {
            padding: 10px;
            background-color: #00d2ff;
            color: #1a1a1a;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-update:hover {
            background-color: #00b8e6;
        }

        .btn-copy {
            padding: 12px;
            background-color: #28a745;
            color: #ffffff;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-copy:hover {
            background-color: #218838;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00d2ff;
        }

        /* 右側預覽區 */
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f0f0f;
        }

        .svg-wrapper {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 控制面板 -->
    <div class="controls">
        <h2 style="margin-bottom: 8px;">水波效果控制</h2>
        
        <div class="control-group">
            <label for="imgUrl">圖片網址 / Base64 數據</label>
            <textarea id="imgUrl" placeholder="可貼上 URL 或 data:image/jpeg;base64,..."></textarea>
            <button type="button" id="btnApplyImg" class="btn-update">更新圖片</button>
        </div>

        <div class="control-group">
            <label for="baseFreqX">X 軸波動頻率 (水平) <span class="val-display" id="freqXVal">0.020</span></label>
            <input type="range" id="baseFreqX" min="0.001" max="0.1" step="0.001" value="0.020">
        </div>

        <div class="control-group">
            <label for="baseFreqY">Y 軸波動頻率 (垂直) <span class="val-display" id="freqYVal">0.040</span></label>
            <input type="range" id="baseFreqY" min="0.001" max="0.1" step="0.001" value="0.040">
        </div>

        <div class="control-group">
            <label for="octaves">水紋細緻度 (NumOctaves) <span class="val-display" id="octVal">3</span></label>
            <input type="range" id="octaves" min="1" max="5" step="1" value="3">
        </div>

        <div class="control-group">
            <label for="scale">折射強度 (Scale) <span class="val-display" id="scaleVal">12</span></label>
            <input type="range" id="scale" min="0" max="100" step="1" value="12">
        </div>

        <div class="control-group">
            <label for="duration">動畫週期（秒） <span class="val-display" id="durVal">20s</span></label>
            <input type="range" id="duration" min="1" max="60" step="1" value="20">
        </div>

        <!-- 複製程式碼按鈕 -->
        <button type="button" id="btnCopyCode" class="btn-copy">複製 SVG 程式碼</button>
    </div>

    <!-- 預覽區域 -->
    <div class="preview-container">
        <div class="svg-wrapper">
            <svg id="previewSvg" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="none">
                <defs>
                    <filter id="water">
                        <feTurbulence id="feTurb" type="turbulence" baseFrequency="0.020 0.040" numOctaves="3" result="turb">
                            <animate id="animFreq" attributeName="baseFrequency" values="0.018 0.036; 0.020 0.040; 0.018 0.036" dur="20s" repeatCount="indefinite" />
                        </feTurbulence>
                        <feDisplacementMap id="feDisp" in="SourceGraphic" in2="turb" scale="12" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </defs>
                <image id="targetImg" width="1980" height="1120" x="-30" y="-20" preserveAspectRatio="none" filter="url(#water)" />
            </svg>
        </div>
    </div>

        // DOM 元素選取
        const imgUrlInput = document.getElementById('imgUrl');
        const btnApplyImg = document.getElementById('btnApplyImg');
        const btnCopyCode = document.getElementById('btnCopyCode');
        const baseFreqXInput = document.getElementById('baseFreqX');
        const baseFreqYInput = document.getElementById('baseFreqY');
        const octavesInput = document.getElementById('octaves');
        const scaleInput = document.getElementById('scale');
        const durationInput = document.getElementById('duration');

        const freqXVal = document.getElementById('freqXVal');
        const freqYVal = document.getElementById('freqYVal');
        const octVal = document.getElementById('octVal');
        const scaleVal = document.getElementById('scaleVal');
        const durVal = document.getElementById('durVal');

        const previewSvg = document.getElementById('previewSvg');
        const feTurb = document.getElementById('feTurb');
        const animFreq = document.getElementById('animFreq');
        const feDisp = document.getElementById('feDisp');
        const targetImg = document.getElementById('targetImg');

        // 更新圖片源
        function applyImage() {
            const val = imgUrlInput.value.trim();
            const src = val || defaultBase64;
            targetImg.setAttribute('href', src);
            targetImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', src);
        }

        // 點擊「更新圖片」按鈕觸發
        btnApplyImg.addEventListener('click', applyImage);

        // 輸入框按 Enter 鍵觸發 (Shift+Enter 可換行)
        imgUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                applyImage();
            }
        });

        // 更新濾鏡與動畫參數
        function updateSVG() {
            const freqX = parseFloat(baseFreqXInput.value);
            const freqY = parseFloat(baseFreqYInput.value);
            const oct = octavesInput.value;
            const sc = scaleInput.value;
            const dur = durationInput.value;

            // 文字數值顯示
            freqXVal.textContent = freqX.toFixed(3);
            freqYVal.textContent = freqY.toFixed(3);
            octVal.textContent = oct;
            scaleVal.textContent = sc;
            durVal.textContent = `${dur}s`;

            // SVG 屬性更新
            feTurb.setAttribute('numOctaves', oct);
            feDisp.setAttribute('scale', sc);
            
            // 計算 X/Y 軸動畫波動範圍 (+/- 10%)
            const minFreqX = (freqX * 0.9).toFixed(4);
            const maxFreqX = freqX.toFixed(4);
            const minFreqY = (freqY * 0.9).toFixed(4);
            const maxFreqY = freqY.toFixed(4);

            animFreq.setAttribute('values', 
                `${minFreqX} ${minFreqY}; ${maxFreqX} ${maxFreqY}; ${minFreqX} ${minFreqY}`
            );
            animFreq.setAttribute('dur', `${dur}s`);
        }

        // 複製 SVG 程式碼功能
        btnCopyCode.addEventListener('click', () => {
            // 複製前先移除內部產生的暫存/內部 ID 雜訊（可選，這裡保留乾淨 HTML）
            const cloneSvg = previewSvg.cloneNode(true);
            
            // 將整段 SVG 轉為字串格式
            const svgString = new XMLSerializer().serializeToString(cloneSvg);

            // 寫入剪貼簿
            navigator.clipboard.writeText(svgString).then(() => {
                const originalText = btnCopyCode.textContent;
                btnCopyCode.textContent = "✓ 已成功複製！";
                btnCopyCode.style.backgroundColor = "#17a2b8";
                
                setTimeout(() => {
                    btnCopyCode.textContent = originalText;
                    btnCopyCode.style.backgroundColor = "#28a745";
                }, 2000);
            }).catch(err => {
                alert("複製失敗，請手動選取複製。");
            });
        });

        // 綁定控制項監聽器
        baseFreqXInput.addEventListener('input', updateSVG);
        baseFreqYInput.addEventListener('input', updateSVG);
        octavesInput.addEventListener('input', updateSVG);
        scaleInput.addEventListener('input', updateSVG);
        durationInput.addEventListener('input', updateSVG);

        // 初始化：寫入預設圖與初始數值
        imgUrlInput.value = defaultBase64;
        applyImage();
        updateSVG();
    </script>
</body>
</html>
